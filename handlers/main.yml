---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true

- name: Restart auditd
  ansible.builtin.command: service auditd restart
  changed_when: true

- name: Load audit rules
  block:
    - name: Check whether audit rules are locked
      ansible.builtin.command: auditctl -s
      register: _harden_audit_status
      changed_when: false

    - name: Load audit rules from rules.d
      ansible.builtin.command: augenrules --load
      changed_when: false
      when: "'enabled 2' not in _harden_audit_status.stdout"
