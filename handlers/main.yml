---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
    enabled: true

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
    enabled: true
