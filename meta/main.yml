---
galaxy_info:
  role_name: harden
  namespace: brotherhugo
  author: BrotherHugo
  description: >-
    Ubuntu/Debian host hardening — practical CIS L1-style baseline (SSH, UFW, fail2ban,
    auditd, sysctl, unattended-upgrades). Not a CIS L2 or compliance profile.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm
        - trixie

dependencies: []

collections:
  - community.general
  - ansible.posix
