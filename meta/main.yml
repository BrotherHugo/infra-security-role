---
galaxy_info:
  role_name: harden
  namespace: brotherhugo
  author: BrotherHugo
  description: >-
    Ubuntu/Debian host hardening — practical subset of CIS L1 (SSH, UFW, fail2ban,
    auditd FIM, sysctl, unattended-upgrades). Not full CIS L1/L2 or a compliance profile.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
    - name: Debian
      versions:
        - bookworm
        - trixie

dependencies: []

collections:
  - community.general
  - ansible.posix
