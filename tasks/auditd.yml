---
- name: Configure auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart auditd

- name: Enable auditd service
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Configure FIM rules for critical files
  ansible.builtin.lineinfile:
    path: /etc/audit/rules.d/audit.rules
    line: "-w {{ item.path }} -p {{ item.permissions }} -k {{ item.key }}"
    state: present
    create: true
    mode: "0640"
    owner: root
    group: root
  loop: "{{ harden.auditd.fim_paths + harden.auditd.fim_paths_extra }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart auditd
