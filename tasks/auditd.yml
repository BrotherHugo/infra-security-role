---
- name: Configure auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart auditd

- name: Enable auditd service
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Configure FIM rules for critical files
  ansible.builtin.template:
    src: 99-harden-fim.rules.j2
    dest: /etc/audit/rules.d/99-harden-fim.rules
    owner: root
    group: root
    mode: "0640"
  notify: Load audit rules
