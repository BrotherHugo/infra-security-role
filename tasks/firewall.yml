---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Reset UFW when forced
  community.general.ufw:
    state: reset
  when: harden.firewall.force_reset | bool

- name: Apply managed firewall rules
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ harden.firewall.rules + harden.firewall.extra_rules }}"
  loop_control:
    label: "{{ item.comment | default(item.port ~ '/' ~ item.proto) }}"

- name: Set UFW default deny incoming
  community.general.ufw:
    direction: incoming
    policy: "{{ harden.firewall.default_incoming }}"

- name: Set UFW default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: "{{ harden.firewall.default_outgoing }}"

- name: Assert SSH port is explicitly allowed in firewall rules
  ansible.builtin.assert:
    that:
      - >-
        (
          harden.firewall.rules + harden.firewall.extra_rules
          | selectattr('port', 'equalto', harden.ssh.port | string)
          | selectattr('proto', 'equalto', 'tcp')
          | rejectattr('rule', 'defined')
          | list
          + (
            harden.firewall.rules + harden.firewall.extra_rules
            | selectattr('port', 'equalto', harden.ssh.port | string)
            | selectattr('proto', 'equalto', 'tcp')
            | selectattr('rule', 'in', ['allow', 'limit'])
            | list
          )
        ) | length > 0
    fail_msg: >-
      harden.firewall.manage is true but no allow/limit rule for SSH port
      {{ harden.ssh.port }}/tcp in harden.firewall.rules or extra_rules.
      Add an explicit rule with the same port as harden.ssh.port (see README).
  when: harden.ssh.enabled | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled
