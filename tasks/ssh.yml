---
- name: Deploy minimal sshd_config with drop-in include
  ansible.builtin.template:
    src: sshd_config_minimal.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  when: harden.ssh.manage_main_config | bool
  notify: Restart ssh

- name: Ensure sshd_config includes drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    state: present
  when: not (harden.ssh.manage_main_config | bool)
  notify: Restart ssh

- name: Remove legacy SSH drop-in after first-match rename
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-harden.conf
    state: absent
  when: harden.ssh.dropin_path != '/etc/ssh/sshd_config.d/99-harden.conf'
  notify: Restart ssh

- name: Restrict permissions on sshd_config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"

- name: Deploy SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_dropin.conf.j2
    dest: "{{ harden.ssh.dropin_path }}"
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
