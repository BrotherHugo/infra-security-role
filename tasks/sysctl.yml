---
- name: Apply sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
  loop: "{{ harden.sysctl.parameters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Persist sysctl parameters
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-harden.conf
    owner: root
    group: root
    mode: "0644"
